[project]
name = "lagpax"
version = "0.0.0"
description = "Local approximate Gaussian processes in JAX — a parity-verified port of the laGP R package"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LGPL-2.0-or-later" }
authors = [{ name = "Davide Sartor", email = "dsartor97@gmail.com" }]
keywords = [
    "gaussian-process",
    "jax",
    "surrogate-model",
    "emulator",
    "uncertainty-quantification",
    "computer-experiments",
    "lagp",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/davidesartor/lagpax"
Repository = "https://github.com/davidesartor/lagpax"
Issues = "https://github.com/davidesartor/lagpax/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lagpax"]
