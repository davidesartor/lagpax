[project]
name = "lagpax"
version = "0.1.0"
description = "Local approximate Gaussian processes in JAX — a parity-verified port of the laGP R package"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LGPL-2.0-or-later" }
authors = [{ name = "Davide Sartor", email = "dsartor97@gmail.com" }]
keywords = [
    "gaussian-process",
    "jax",
    "surrogate-model",
    "emulator",
    "uncertainty-quantification",
    "computer-experiments",
    "lagp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.10.0",
    "jaxtyping>=0.2.0",
    "jaxvlse>=0.1.3",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.10.0"]
tests = [
    "pytest",
    "rpy2>=3.5.17,<3.6",
]
bench = [
    "matplotlib>=3.10",
    "pandas>=2.0",
    "rpy2>=3.5.17,<3.6",
]

[project.urls]
Homepage = "https://github.com/davidesartor/lagpax"
Repository = "https://github.com/davidesartor/lagpax"
Issues = "https://github.com/davidesartor/lagpax/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lagpax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
